name: Refresh recipe metadata

# Manually dispatched: runs the enrichment script on a GitHub-hosted runner
# (which can reach hellofresh.com) and commits the refreshed images/metadata.
# Note: commits pushed with GITHUB_TOKEN do not retrigger the Pages deploy —
# dispatch the "Deploy to GitHub Pages" workflow afterwards to publish.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run enrichment script
        run: node scripts/enrich-meals.mjs

      - name: Commit refreshed metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/mealMeta.json public/meal-images
          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
          else
            git commit -m "Refresh recipe metadata from HelloFresh"
            git push
          fi
